[pytest]
strict = true
addopts = [
    "--report-chars=a",
    "--exitfirst",
    "--numprocesses=auto",
    "--quiet",
    "--tb=short",
    "-m",
    "not linear_live and not github_live and not orca_live",
]
markers = [
    "linear_live: runs against the live Linear integration-test workspace",
    "github_live: runs against the live GitHub integration-test repository",
    "orca_live: creates and removes worktrees in the local Orca, from an mb-workflow worktree",
]
testpaths = ["src"]
python_files = ["test_*.py"]
