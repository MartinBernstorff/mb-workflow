target-version = "py314"
line-length = 100

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PT",
    "A",
    "RET",
    "RUF",
    "TID",
    "PIE",
    "PL",
    "ARG",
    "PTH",
    "ERA",
    "TC",
    "ASYNC",
    "FBT",
    "ISC",
    "LOG",
    "G",
    "INP",
    "T20",
    "Q",
    "SLF",
    "FURB",
    "PERF",
    "TRY",
]
ignore = [
    "E501",
    "W191",
    "E111",
    "E114",
    "E117",
    "COM812",
    "ISC001",
    "A005",
    "RUF022",
    "PLR0913",
    "B008",
]

[lint.per-file-ignores]
"**/test_*.py" = ["PLR2004", "ARG"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
