[project]
name = "mb-assertions"
version = "0.1.0"
description = "A type-checked assertion builder, where the expected value's type is fixed by the actual value's type."
readme = "README.md"
authors = [
    { name = "Martin Bernstorff", email = "martinbernstorff@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "safe-result>=4.0.3",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assertions"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.6",
    "tach>=0.35.0",
]
