extend = "../../ruff.toml"
src = ["src"]

[lint.isort]
known-first-party = ["mb_workflow"]

[lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic.RootModel",
    "mb_workflow.d_lib.models.Model",
    "mb_workflow.d_lib.models.Payload",
    "mb_workflow.d_lib.models.Value",
]

[lint]
ignore = [
    # These messages sit on raises that TY-7e replaces with error values; the NoRaise baseline in .hemolint/ tracks
    # the remaining raises. Drop this ignore once the migration ends.
    "TRY003",
    # Logged errors are user-facing messages; a traceback would be noise.
    "TRY400",
]
