extend = "../../ruff.toml"
src = ["src"]

[lint.isort]
known-first-party = ["mb_workflow"]

[lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic.RootModel",
    "mb_workflow.d_lib.models.Model",
    "mb_workflow.d_lib.models.Payload",
    "mb_workflow.d_lib.models.Value",
]

[lint]
ignore = [
    # These messages sit on raises that TY-7e replaces with error values; raise-baseline/ tracks
    # the remaining raises. Drop this ignore once the migration ends.
    "TRY003",
    # Logged errors are user-facing messages; a traceback would be noise.
    "TRY400",
    # Bools are passed wrapped in Value[bool] types, e.g. Force(True), so the call site names them.
    "FBT003",
]

[lint.extend-per-file-ignores]
# A Typer command's bool parameter and its typer.Option default are a CLI flag, not a boolean trap.
"src/mb_workflow/a_presentation/cli/**" = ["FBT001", "FBT003"]
