language: "python"
stack: "backend"
layer: "application"

tasks:
  # Serial, because every test rewrites the same seeded issues in the integration-test workspace.
  test-linear-live:
    script: "uv run pytest -m linear_live --numprocesses=0 src/mb_workflow/c_infrastructure/test_ticket_tracker.py"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
      - "pytest.toml"
      - "@group(sources)"
    options:
      cache: false
      runInCI: false
      outputStyle: "buffer-only-failure"

  test-github-live:
    script: "uv run pytest -m github_live --numprocesses=0 src/mb_workflow/c_infrastructure/test_code_review.py"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
      - "pytest.toml"
      - "@group(sources)"
    options:
      cache: false
      runInCI: false
      outputStyle: "buffer-only-failure"

  # Serial, because every test rewrites the same seeded worktrees in the integration-test project.
  test-orca-live:
    script: "uv run pytest -m orca_live --numprocesses=0 src/mb_workflow/c_infrastructure/test_workspace_manager.py"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
      - "pytest.toml"
      - "@group(sources)"
    options:
      cache: false
      runInCI: false
      outputStyle: "buffer-only-failure"

  # The workflows are repo-wide; mb-workflow owns the check because its dev dependencies provide actionlint.
  actionlint:
    script: "uv run actionlint"
    inputs:
      - "/.github/workflows/*.yml"
    options:
      outputStyle: "buffer-only-failure"

  diagram:
    script: "mkdir -p docs && uv run mw flow diagram --quiet --output docs/flow.svg && uv run mw flow diagram --quiet --output docs/flow.md"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
      - "src/mb_workflow/a_presentation/diagram.py"
      - "src/mb_workflow/b_core/d_domain_model/flow.py"
    outputs:
      - "docs/flow.svg"
      - "docs/flow.md"
    options:
      runInCI: false
      outputStyle: "buffer-only-failure"

  phase-1:
    deps:
      - "diagram"
      - "actionlint"

  full:
    deps:
      - "actionlint"
