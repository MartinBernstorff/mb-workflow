[project]
name = "mb-workflow"
version = "0.1.0"
description = "Workflow automation CLI."
readme = "README.md"
authors = [
    { name = "Martin Bernstorff", email = "martinbernstorff@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "linear-python-client>=0.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-statemachine[diagrams]>=3.2.1",
    "safe-result>=4.0.3",
    "stamina>=26.1.0",
    "typer>=0.27.2",
]

[project.scripts]
mb-workflow = "mb_workflow:main"
mw = "mb_workflow:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.24",
    "lefthook>=2.1.12",
    "mb-assertions",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.6",
    "tach>=0.35.0",
]

[tool.uv.sources]
mb-assertions = { path = "../mb-assertions", editable = true }
