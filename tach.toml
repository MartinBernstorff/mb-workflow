[[modules]]
path = "mb_workflow.issue"
depends_on = ["mb_workflow.models"]

[[modules]]
path = "mb_workflow.pull_request"
depends_on = ["mb_workflow.models"]

[[modules]]
path = "mb_workflow.models"
depends_on = []

[[modules]]
path = "mb_workflow.logging"
depends_on = []

[[modules]]
path = "mb_workflow.cache"
depends_on = ["mb_workflow.models"]

[[modules]]
path = "mb_workflow.clock"
depends_on = ["mb_workflow.models"]

[[modules]]
