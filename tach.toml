source_roots = ["src"]

# Tests sit beside the code they cover, so each layer also owns their imports.
[[modules]]
path = "mb_workflow"
depends_on = ["mb_workflow.a_presentation"]

[[modules]]
path = "mb_workflow.a_presentation"
depends_on = [
    "mb_workflow.a_presentation.console",
    "mb_workflow.b_core",
    "mb_workflow.b_core.features",
    "mb_workflow.c_infrastructure",
    "mb_workflow.d_lib",
]

# The exit code is a console protocol, and the features below return it. Scoped to the
# console alone, so any other reach from a lower layer into presentation still fails.
[[modules]]
path = "mb_workflow.a_presentation.console"
depends_on = ["mb_workflow.d_lib"]

[[modules]]
path = "mb_workflow.b_core.features"
depends_on = [
    "mb_workflow.a_presentation.console",
    "mb_workflow.b_core",
    "mb_workflow.c_infrastructure",
    "mb_workflow.d_lib",
]

[[modules]]
path = "mb_workflow.b_core"
depends_on = ["mb_workflow.d_lib"]

[[modules]]
path = "mb_workflow.c_infrastructure"
depends_on = ["mb_workflow.b_core", "mb_workflow.d_lib"]

[[modules]]
path = "mb_workflow.d_lib"
depends_on = []
