source_roots = ["src"]

# Tests sit beside the code they cover, so the root module also owns their imports.
[[modules]]
path = "mb_workflow"
depends_on = [
    "mb_workflow.cli",
    "mb_workflow.config",
    "mb_workflow.diagram",
    "mb_workflow.flow",
    "mb_workflow.git",
    "mb_workflow.link",
    "mb_workflow.lock",
]

[[modules]]
path = "mb_workflow.cli"
depends_on = [
    "mb_workflow.cache",
    "mb_workflow.clock",
    "mb_workflow.config",
    "mb_workflow.diagram",
    "mb_workflow.issue",
    "mb_workflow.link",
    "mb_workflow.lock",
    "mb_workflow.logging",
    "mb_workflow.shell",
    "mb_workflow.trackers",
    "mb_workflow.workflows",
    "mb_workflow.workspace",
]

[[modules]]
path = "mb_workflow.workflows"
depends_on = [
    "mb_workflow.cache",
    "mb_workflow.clock",
    "mb_workflow.config",
    "mb_workflow.git",
    "mb_workflow.issue",
    "mb_workflow.link",
    "mb_workflow.lock",
    "mb_workflow.models",
    "mb_workflow.pull_request",
    "mb_workflow.shell",
    "mb_workflow.trackers",
    "mb_workflow.workspace",
]

[[modules]]
path = "mb_workflow.workspace"
depends_on = [
    "mb_workflow.git",
    "mb_workflow.issue",
    "mb_workflow.models",
    "mb_workflow.pull_request",
    "mb_workflow.shell",
]

[[modules]]
path = "mb_workflow.trackers"
depends_on = [
    "mb_workflow.clock",
    "mb_workflow.git",
    "mb_workflow.issue",
    "mb_workflow.models",
    "mb_workflow.pull_request",
    "mb_workflow.shell",
]

[[modules]]
path = "mb_workflow.link"
depends_on = ["mb_workflow.models"]

[[modules]]
path = "mb_workflow.lock"
depends_on = ["mb_workflow.cache", "mb_workflow.models"]

[[modules]]
path = "mb_workflow.diagram"
