source_roots = ["src"]

# Tests sit beside the code they cover, so each layer also owns their imports.
[[modules]]
path = "mb_workflow"
depends_on = ["mb_workflow.a_presentation"]

[[modules]]
path = "mb_workflow.a_presentation"
depends_on = [
    "mb_workflow.b_core.a_features",
    "mb_workflow.b_core.b_domain_services",
    "mb_workflow.b_core.c_secondary_ports",
    "mb_workflow.b_core.d_domain_model",
    "mb_workflow.c_infrastructure",
    "mb_workflow.d_lib",
]

[[modules]]
path = "mb_workflow.b_core"
depends_on = []

[[modules]]
path = "mb_workflow.b_core.a_features"
depends_on = [
    "mb_workflow.b_core.b_domain_services",
    "mb_workflow.b_core.c_secondary_ports",
    "mb_workflow.b_core.d_domain_model",
    "mb_workflow.c_infrastructure",
    "mb_workflow.d_lib",
]

[[modules]]
path = "mb_workflow.b_core.b_domain_services"
depends_on = [
    "mb_workflow.b_core.c_secondary_ports",
    "mb_workflow.b_core.d_domain_model",
    "mb_workflow.d_lib",
]

# Any layer may reach the secondary ports; they reach nothing but the domain model.
[[modules]]
path = "mb_workflow.b_core.c_secondary_ports"
depends_on = ["mb_workflow.b_core.d_domain_model", "mb_workflow.d_lib"]

[[modules]]
path = "mb_workflow.b_core.d_domain_model"
depends_on = ["mb_workflow.d_lib"]

[[modules]]
path = "mb_workflow.c_infrastructure"
depends_on = [
    "mb_workflow.b_core.c_secondary_ports",
    "mb_workflow.b_core.d_domain_model",
    "mb_workflow.d_lib",
]

[[modules]]
path = "mb_workflow.d_lib"
depends_on = []
