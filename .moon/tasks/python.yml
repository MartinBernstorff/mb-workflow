# Inherited by every Python app under apps/. An app's moon.yml only adds or overrides tasks.
inheritedBy:
  languages: ["python"]

fileGroups:
  sources:
    - "src/**/*.py"

tasks:
  test:
    script: "uv run pytest"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
      - "pytest.toml"
      - "@group(sources)"
    options:
      outputStyle: "buffer-only-failure"

  types:
    script: "uv run pyrefly check src"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
      - "pyrefly.toml"
      - "/pyrefly.toml"
      - "@group(sources)"
    options:
      outputStyle: "buffer-only-failure"

  modularity:
    script: "uv run tach check"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
      - "tach.toml"
      - "@group(sources)"
    options:
      outputStyle: "buffer-only-failure"

  noprim:
    script: "uv run noprim check src"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
      - "noprim.toml"
      - "@group(sources)"
    options:
      outputStyle: "buffer-only-failure"

  # Fixit runs from the lint-rules environment, because it pins a click version the apps' Typer can't use.
  # hemolint compares the violations to the app's baseline in .hemolint/. Fixit exits 1 on any violation,
  # so the pipe takes hemolint's exit code.
  fixit:
    script: "uv run --project $workspaceRoot/packages/lint-rules fixit lint src | uv run --project $workspaceRoot/apps/hemolint hemolint check --format fixit"
    inputs:
      - file: "fixit.toml"
        optional: true
      - "src/**/fixit.toml"
      - "/fixit.toml"
      - ".hemolint/**/*"
      - "/packages/lint-rules/pyproject.toml"
      - "/packages/lint-rules/uv.lock"
      - "/packages/lint-rules/src/**/*.py"
      - "/apps/hemolint/pyproject.toml"
      - "/apps/hemolint/uv.lock"
      - "/apps/hemolint/src/**/*.py"
      - "@group(sources)"
    options:
      outputStyle: "buffer-only-failure"

  # Removes fixed violations from the baseline, but still fails on new ones.
  fixit-prune:
    script: "uv run --project $workspaceRoot/packages/lint-rules fixit lint src | uv run --project $workspaceRoot/apps/hemolint hemolint check --format fixit --prune"
    options:
      cache: false
      runInCI: false

  # Records every current violation, including new ones, in the baseline.
  fixit-baseline:
    script: "uv run --project $workspaceRoot/packages/lint-rules fixit lint src | uv run --project $workspaceRoot/apps/hemolint hemolint check --format fixit --baseline"
    options:
      cache: false
      runInCI: false

  lint:
    script: "uv run ruff check"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
      - "/ruff.toml"
      - "@group(sources)"
    options:
      outputStyle: "buffer-only-failure"

  lint-fix:
    script: "uv run ruff check --fix"
    options:
      cache: false
      runInCI: false

  format:
    script: "uv run ruff format --check"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
      - "/ruff.toml"
      - "@group(sources)"
    options:
      outputStyle: "buffer-only-failure"

  format-fix:
    script: "uv run ruff format"
    options:
      cache: false
      runInCI: false

  install:
    script: "uv tool install --force --reinstall ."
    options:
      cache: false
      runInCI: false

  # Serial, because the fix tasks rewrite the sources the checks read.
  phase-1:
    deps:
      - "lint-fix"
      - "format-fix"
      - "types"
      - "modularity"
      - "noprim"
      - "fixit"
    inputs: []
    options:
      runDepsInParallel: false
      runInCI: false

  full:
    deps:
      - "lint"
      - "format"
      - "types"
      - "modularity"
      - "noprim"
      - "fixit"
      - "test"
    inputs: []
    options:
      runInCI: false
